version = 1
repo = "jthingelstad/rwbookclub.com"
cwd = "/Users/otto/Projects/rwbookclub.com"
state_dir = "/Users/otto/Library/Application Support/com.rwbookclub.agent-team-dispatcher"
poll_interval_seconds = 900
role_timeout_seconds = 5400
chain_limit = 4
chain_window_minutes = 90
max_attempts = 3
retry_delays_seconds = [300, 1800, 7200]
log_retention_days = 30

codex_bin = "/Applications/ChatGPT.app/Contents/Resources/codex"
gh_bin = "/opt/homebrew/bin/gh"
git_bin = "/usr/bin/git"
preflight = "/Users/otto/Projects/rwbookclub.com/AGENT-TEAM/scripts/preflight.sh"
automation_registry = "/Users/otto/Projects/rwbookclub.com/AGENT-TEAM/automations.toml"

dispatch_prefix = "dispatch:"
stop_labels = ["proposal", "blocked", "needs-design", "wip"]
pending_labels = ["needs-eval", "needs-culture"]

[[routes]]
label = "dispatch:operations"
role = "operations-manager"
role_file = "AGENT-TEAM/operations-manager.md"
model = "gpt-5.6-terra"
reasoning_effort = "high"
priority = 10

[[routes]]
label = "dispatch:culture"
role = "club-ethnographer"
role_file = "AGENT-TEAM/club-ethnographer.md"
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"
priority = 20

[[routes]]
label = "dispatch:evaluator"
role = "evaluator"
role_file = "AGENT-TEAM/evaluator.md"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
priority = 30

[[routes]]
label = "dispatch:build"
role = "build-manager"
role_file = "AGENT-TEAM/build-manager.md"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
priority = 40

[[routes]]
label = "dispatch:product"
role = "product-manager"
role_file = "AGENT-TEAM/product-manager.md"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
priority = 50

[[routes]]
label = "dispatch:manager"
role = "manager"
role_file = "AGENT-TEAM/manager.md"
model = "gpt-5.6-sol"
reasoning_effort = "high"
priority = 60

# Explicit dispatch labels always win. These rules only seed a handoff for an older or
# human-filed issue that predates the dispatcher protocol.
[[inference]]
route = "dispatch:operations"
all = ["needs-deploy"]

[[inference]]
route = "dispatch:culture"
all = ["needs-culture"]

[[inference]]
route = "dispatch:evaluator"
all = ["needs-eval"]

[[inference]]
route = "dispatch:build"
any = ["bug", "regression"]
none = ["needs-deploy", "needs-eval", "needs-culture"]

[[inference]]
route = "dispatch:build"
all = ["approved", "ready"]
none = ["needs-deploy", "needs-eval", "needs-culture"]

[[inference]]
route = "dispatch:operations"
all = ["operations", "ready"]
none = ["needs-deploy", "needs-eval", "needs-culture"]
