version = 2
repo = "."
timezone = "America/Chicago"

# Approved September 9, 2026. Calendar starts use local Chicago time.
# schedule_of entries share the original objective, lease, and automation memory.
# Interval activities use an initial prompt date check because the installed app
# miscalculates interval timezones. Preserve that check when reinstalling.
# launch_cwd records the app launch directory relative to this checkout.
# Event-driven follow-ups remain explicit starts; these are calendar schedules.

[[automation]]
id = "oliver-operations-manager"
name = "Run Oliver"
objective = "run"
objective_file = "AGENT-TEAM/run-oliver.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=WEEKLY;BYDAY=WE,SA;BYHOUR=6;BYMINUTE=10"
model = "gpt-5.6-terra"
reasoning_effort = "high"
execution_environment = "local"
launch_cwd = ".."
prompt = "Use `/Users/otto/Projects/rwbookclub.com` as the working directory for this scheduled activity. Before running commands, change to that directory and read its `AGENTS.md` plus any applicable parent instructions. Follow the project instructions already loaded by Codex. Read `/Users/otto/Projects/rwbookclub.com/AGENT-TEAM/WORKFLOW.md`, `/Users/otto/Projects/rwbookclub.com/AGENT-TEAM/README.md`, `/Users/otto/Projects/rwbookclub.com/AGENT-TEAM/run-oliver.md` completely, then pursue the `run` objective exactly as written. Measure current evidence before changing anything. Own a clear gap through source fix, regression coverage, verification, deployment or restart when required, and natural acceptance. Use issues only for multi-run work, external blockers, durable audits, or Jamie decisions. Run preflight first; acquire the objective lease only before mutation; never publish pre-existing work; preserve human and privacy boundaries; and end with a clean repository. Keep automation memory to Current state, Active watches, and one replace-in-place Latest run."

