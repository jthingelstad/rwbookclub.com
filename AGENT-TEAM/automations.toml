# An entry may say ACTIVE only while the corresponding local Codex scheduled activity exists,
# is enabled, and matches the role, schedule, model, reasoning effort, project, and working path.
# PAUSED entries are historical schedule definitions, not a dormant queue to reactivate. The
# dedicated Oliver Dispatcher heartbeat launches those roles as normal app-visible project threads.
# Every ACTIVE execution must also create a normal visible project thread and follow the compact
