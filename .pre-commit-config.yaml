# Pre-commit hooks for Oliver. Runs Ruff lint and format checks on every commit —
# the same gates CI enforces on push (see .github/workflows/tests.yml).
#
# Activate once per clone:
#   uv sync --locked && uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
      - id: ruff-format
